<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Merchandise – Oachberghexa Shop</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f1936, #a64fff);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 15px;
            color: #1f1936;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 10px 0 5px;
        }

        .card p {
            margin: 5px 0;
        }

        .details-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #070707;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        .details-btn:hover {
            background: #5200b8;
        }
    </style>
</head>
<body>

<h1>Merchandise</h1>

<div class="grid">
    {% for produkt in produkte %}
    <div class="card">

        <img src="{{ url_for('static', filename='img/' + produkt['bild']) }}" alt="{{ produkt['name'] }}">
        <h3>{{ produkt['name'] }}</h3>
        <p><strong>{{ produkt['preis'] }} €</strong></p>

        <!-- Details-Button (führt zur Auswahl + Warenkorb) -->
        <a href="/produkt/{{ produkt['id'] }}" class="details-btn">Details ansehen</a>

    </div>
    {% endfor %}
</div>

</body>
</html>
