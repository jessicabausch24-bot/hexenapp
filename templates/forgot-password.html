<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort vergessen – Oachberghexa App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f1936, #a64fff);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            color: #1f1936;
        }

        .card-header {
            padding: 30px 25px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(166,79,255,0.15), rgba(255,255,255,0));
        }

        .card-header img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 18px;
        }

        .card-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .card-header p {
            margin: 10px 0 0;
            color: #6d5bd8;
        }

        .card-body {
            padding: 30px 25px 30px;
        }

        .card-body label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .card-body input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid #d4c7ff;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .card-body button {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: none;
            background: #6a1cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-body button:hover {
            background: #5200b8;
        }

        .card-body .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #6d5bd8;
        }

        .card-body a {
            color: #6a1cff;
            text-decoration: none;
        }

        .error {
            color: #c60f0f;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .success {
            color: #2c6d1a;
            margin-top: -10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <img src="{{ url_for('static', filename='img/placeholder.png') }}" alt="Oachberghexa Logo">
        <h1>Passwort vergessen</h1>
        {% if show_reset %}
        <p>Neues Passwort für {{ email }} vergeben</p>
        {% else %}
        <p>E-Mail-Adresse eingeben</p>
        {% endif %}
    </div>
    <div class="card-body">
        {% if not show_reset %}
        <form action="/forgot-password" method="POST">
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" name="email" required placeholder="ihre.email@example.com">

            <button type="submit">E-Mail prüfen</button>
        </form>
        {% else %}
        <form action="/forgot-password" method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <label for="new_password">Neues Passwort</label>
            <input type="password" id="new_password" name="new_password" required placeholder="Neues Passwort">

            <label for="confirm_password">Passwort bestätigen</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Passwort wiederholen">

            <button type="submit">Passwort ändern</button>
        </form>
        {% endif %}

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}

        <p class="hint"><a href="/login">Zurück zum Login</a></p>
    </div>
</div>

</body>
</html>
