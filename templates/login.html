<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    min-height: 100vh;
    overflow: hidden;
}

.login-wrapper {
    display: flex;
    width: 100%;
    min-height: 100vh;
    position: relative;
}

.side {
    flex: 1;
    height: 100vh;
    overflow: hidden;
}

.side img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.login-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    max-width: calc(100vw - 32px);
    padding: 34px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 24px;
    box-shadow: 0 14px 45px rgba(0,0,0,0.35);
    z-index: 10;
    box-sizing: border-box;
}

.login-card label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #222;
}

.login-card input {
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 46px;
}

.toggle-password {
    position: absolute;
    right: 13px;
    top: 14px;
    width: 22px;
    height: 14px;
    border: 2px solid #555;
    border-radius: 50%;
    cursor: pointer;
    box-sizing: border-box;
}

.toggle-password::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 6px;
    background: #555;
    border-radius: 50%;
    top: 2px;
    left: 6px;
}

.login-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #7b2ff7, #a64fff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.register-text {
    margin-top: 16px;
    text-align: center;
    color: #333;
}

.register-text a {
    color: #7b2ff7;
    text-decoration: none;
    font-weight: bold;
}

.error {
    margin-top: 15px;
    color: #b00020;
    text-align: center;
    font-weight: bold;
}

.footer-links {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    z-index: 20;
}

.footer-links a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

@media screen and (max-width: 768px) {
    .login-card {
        width: 86vw;
        max-width: 360px;
        padding: 26px 22px;
        border-radius: 22px;
    }

    .login-card input {
        padding: 12px;
        font-size: 15px;
        margin-bottom: 14px;
    }

    .password-wrapper input {
        padding-right: 46px;
    }

    .login-card button {
        padding: 13px;
        font-size: 15px;
    }

    .footer-links {
        font-size: 12px;
        bottom: 8px;
    }
}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="side left">
        <img src="{{ url_for('static', filename='img/Links_Login.jpeg') }}">
    </div>

    <div class="side right">
        <img src="{{ url_for('static', filename='img/Recht_Login.jpeg') }}">
    </div>

    <div class="login-card">
        <form method="POST">
            <label>E-Mail</label>
            <input type="email" name="email" required>

            <label>Passwort</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required>
                <span class="toggle-password" onclick="togglePassword('password')" title="Passwort anzeigen"></span>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="register-text">
            Noch kein Konto? <a href="{{ url_for('register') }}">Registrieren</a>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>

</div>

<div class="footer-links">
    <a href="{{ url_for('datenschutz') }}">Datenschutz</a>
    <a href="{{ url_for('impressum') }}">Impressum</a>
</div>

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
