<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 1200px;
    position: relative;
}

.side {
    flex: 1;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

.side img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.side.left::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 120px;
    height: 100%;
    background: linear-gradient(to right, transparent, rgba(31,25,54,0.9));
}

.side.right::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 100%;
    background: linear-gradient(to left, transparent, rgba(166,79,255,0.9));
}

.login-card {
    position: absolute;
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    padding: 34px;
    color: #1f1936;
    z-index: 10;
    border: 2px solid black;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4), 0 25px 60px rgba(0,0,0,0.35);
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    text-align: center;
    font-size: 18px;
}

input {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: 1px solid #ccc;
    margin-bottom: 20px;
    box-sizing: border-box;
    text-align: center;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 18px;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg, #6a1cff, #9d4dff);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #5200b8;
}

a {
    color: #6a1cff;
    text-decoration: none;
}

.register-text {
    margin-top: 18px;
    text-align: center;
    font-size: 17px;
}

.error {
    color: red;
    margin-top: 10px;
    text-align: center;
}

.message {
    color: green;
    margin-top: 10px;
    text-align: center;
}

@media (max-width: 768px) {

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow: hidden;
    }

    .login-wrapper {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
    }

    .side {
        display: block !important;
        width: 50%;
        height: 100vh;
        flex: 1;
    }

    .side img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .login-card {
        position: absolute !important;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 88vw !important;
        max-width: 520px !important;

        padding: 45px 28px !important;
        border-radius: 28px !important;

        z-index: 10;
        box-sizing: border-box;
    }

    .login-card label {
        font-size: 20px !important;
    }

    .login-card input {
        width: 100% !important;
        height: 58px !important;
        font-size: 18px !important;
        padding: 14px !important;
        margin-bottom: 22px !important;
        border-radius: 14px !important;
        box-sizing: border-box;
    }

    .login-card button {
        width: 100% !important;
        height: 60px !important;
        font-size: 18px !important;
        border-radius: 16px !important;
    }

    .register-text,
    .register-text a {
        font-size: 17px !important;
    }
}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="side left">
        <img src="{{ url_for('static', filename='img/Links_Login.jpeg') }}">
    </div>

    <div class="login-card">

        <form action="/login" method="POST">

            <label>E-Mail</label>
            <input type="email" name="email" required placeholder="deine@email.de">

            <label>Passwort</label>
            <input type="password" name="password" required placeholder="********">

            <button type="submit">Einloggen</button>

            <p class="register-text">
                Noch kein Konto?
                <a href="{{ url_for('register') }}"><b>Jetzt registrieren</b></a>
            </p>

        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message">{{ success }}</div>
        {% endif %}

    </div>

    <div class="side right">
        <img src="{{ url_for('static', filename='img/Recht_Login.jpeg') }}">
    </div>

</div>

</body>
</html>
