<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    min-height: 100vh;
    overflow: hidden;
}

.login-wrapper {
    display: flex;
    width: 100%;
    min-height: 100vh;
    position: relative;
}

.side {
    flex: 1;
    height: 100vh;
    overflow: hidden;
}

.side img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.login-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    padding: 34px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 24px;
    box-shadow: 0 14px 45px rgba(0,0,0,0.35);
    z-index: 10;
    box-sizing: border-box;
}

.login-card label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #222;
}

.login-card input {
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
}

.login-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #7b2ff7, #a64fff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.register-text {
    margin-top: 16px;
    text-align: center;
    color: #333;
}

.register-text a {
    color: #7b2ff7;
    text-decoration: none;
}

.error {
    margin-top: 15px;
    color: #b00020;
    text-align: center;
    font-weight: bold;
}

.footer-links {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font-size: 13px;
}

.footer-links a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
}
</style>

</head>

<body>

<div class="login-wrapper">

    <div class="side left">
        <img src="{{ url_for('static', filename='img/login_left.jpg') }}">
    </div>

    <div class="side right">
        <img src="{{ url_for('static', filename='img/login_right.jpg') }}">
    </div>

    <div class="login-card">
        <form method="POST">
            <label>E-Mail</label>
            <input type="email" name="email" required>

            <label>Passwort</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <div class="register-text">
            Noch kein Konto? <a href="{{ url_for('register') }}">Registrieren</a>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>

</div>

<div class="footer-links">
    <a href="{{ url_for('datenschutz') }}">Datenschutz</a>
    <a href="{{ url_for('impressum') }}">Impressum</a>
</div>

</body>
</html>
