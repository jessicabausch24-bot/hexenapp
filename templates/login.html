<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    min-height: 100vh;
    overflow: hidden;
}

.login-wrapper {
    display: flex;
    width: 100%;
    min-height: 100vh;
    position: relative;
}

.side {
    flex: 1;
    height: 100vh;
    overflow: hidden;
}

.side img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.login-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    padding: 34px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 24px;
    box-shadow: 0 14px 45px rgba(0,0,0,0.35);
}

.login-card label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #222;
}

.login-card input {
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
}

.login-card button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #7b2ff7, #a64fff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    width: 100%;
    padding-right: 40px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
}

.footer-links {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
}
</style>
</head>

<body>

<div class="login-wrapper">

    <div class="side left">
        <img src="{{ url_for('static', filename='img/Links_Login.jpeg') }}">
    </div>

    <div class="side right">
        <img src="{{ url_for('static', filename='img/Recht_Login.jpeg') }}">
    </div>

    <div class="login-card">
        <form method="POST">
            <label>E-Mail</label>
            <input type="email" name="email" required>

            <label>Passwort</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password">
                <span onclick="togglePassword('password')">👁️</span>
            </div>

            <button type="submit">Login</button>
        </form>

        {% if error %}
            <div style="color:red; text-align:center;">{{ error }}</div>
        {% endif %}
    </div>

</div>

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
