<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* 🔥 Hauptbereich */
.main {
    flex: 1;
    padding: 20px;
}

.wrapper {
    max-width: 1100px;
    margin: 0 auto;
}

/* Header */
h1 {
    margin-bottom: 25px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    transition: 0.2s;
    padding: 0;
}

.card:hover {
    transform: translateY(-5px);
}

/* 🔥 Bildbereich */
.image-box {
    width: 100%;
    height: 240px;
    background: #e8d5c2; /* passt zu deinem Bild */
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 🔥 Bild perfekt */
.category-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* 🔥 Titelbereich */
.title-box {
    background: white;
    padding: 15px;
}

.title-box h2,
.card h2 {
    margin: 0;
    font-size: 22px;
    color: #000000 !important;
}
/* 🔥 FOOTER */
.footer-bar {
    background: #1f1936;
    padding: 14px;
    text-align: center;
}

.footer-bar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin: 0 20px;
    font-size: 16px;
}

.footer-bar a:hover {
    text-decoration: underline;
}
.top-bar {
    position: absolute;
    top: 20px;
    right: 30px;
}

.cart-btn {
    background: black;
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.cart-btn:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="main">
<div class="wrapper">

    <h1>Shop</h1>

    <div class="grid">

        <!-- Häß Teile -->
        <a class="card" href="{{ url_for('shop_haes_teile') }}">
            <img src="{{ url_for('static', filename='img/Kategorie_Häßteile.png') }}" class="category-img">
            <h2>Häß-Teile</h2>
        </a>

        <!-- Maskenzubehör -->
        <a class="card" href="{{ url_for('shop_masken_zubehoer') }}">
            <img src="{{ url_for('static', filename='img/kategorie_masken.jpg') }}" class="category-img">
            <h2>Maskenzubehör</h2>
        </a>

        <!-- Merchandise -->
        <a class="card" href="{{ url_for('shop_merchandise') }}">
            <img src="{{ url_for('static', filename='img/kategorie_merch.jpg') }}" class="category-img">
            <h2>Merchandise</h2>
        </a>

    <div class="top-bar">
    <a href="{{ url_for('cart') }}" class="cart-btn">
        🛒 Warenkorb
    </a>
</div>

    </div>

</div>
</div>

<!-- 🔥 Footer wie Dashboard -->
<div class="footer-bar">
    <a href="{{ url_for('dashboard') }}">Start</a>

    {% if session.user == "Jessi24" %}
        <a href="{{ url_for('admin') }}">Admin</a>
    {% endif %}

    <a href="{{ url_for('logout') }}">Logout</a>
</div>

</body>
</html>
