<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

/* 🔥 Hauptbereich */
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 20px 15px;
}

.wrapper {
    max-width: 1200px;
    width: 100%;
}

/* 🔥 Titel */
h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 34px;
}

/* 🔥 Layout */
.dashboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
}

/* 🔥 Bild */
.left {
    flex: 1;
    display: flex;
    justify-content: center;
}

.side-img {
    width: 100%;
    max-width: 420px;
    max-height: 480px;
    object-fit: contain;
}

/* 🔥 Kacheln */
.right {
    flex: 1;
}

.grid {
    display: grid;
    gap: 18px;
}

.card {
    background: white;
    color: #1f1936;
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    font-size: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.card:hover {
    background: #f2f2f2;
    transform: translateY(-3px);
}
.bottom-links {
    position: fixed;
    bottom: 70px; /* Abstand über der Footer-Leiste */
    right: 30px;
    font-size: 13px;
}

.bottom-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    margin-left: 15px;
}

.bottom-links a:hover {
    color: white;
    text-decoration: underline;
}
/* 🔥 Footer */
.footer-bar {
    background: #1f1936;
    padding: 12px;
    text-align: center;
}

.footer-bar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin: 0 15px;
    font-size: 16px;
}

.footer-bar a:hover {
    text-decoration: underline;
}

/* 🔥 MOBILE OPTIMIERUNG */
@media (max-width: 800px) {

    .main {
        padding: 15px 12px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 15px;
    }

    .dashboard {
        flex-direction: column;
        gap: 20px;
    }

    .left {
        width: 100%;
    }

    .side-img {
        max-width: 220px;
        max-height: 240px;
    }

    .right {
        width: 100%;
    }

    .grid {
        width: 100%;
        gap: 12px;
    }

    .card {
        width: 100%;
        box-sizing: border-box;
        padding: 18px;
        font-size: 18px;
    }
}

/* 🔥 EXTRA kleine Handys */
@media (max-width: 420px) {

    .side-img {
        max-width: 180px;
    }

    h1 {
        font-size: 24px;
    }

    .card {
        padding: 16px;
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="main">
    <div class="wrapper">

        <h1>Hallo {{ user }}</h1>

        <div class="dashboard">

            <div class="left">
                <img src="{{ url_for('static', filename='img/header.jpeg') }}"
                     alt="Hexenbild"
                     class="side-img">
            </div>

            <div class="right">
                <div class="grid">

                    <a class="card" href="{{ url_for('shop') }}">
                        🛒 Shop
                    </a>

                    <a class="card" href="{{ url_for('bus') }}">
                        🚌 Bus
                    </a>

                    <a class="card" href="{{ url_for('meine_bestellungen') }}">
                        📦 Meine Bestellungen
                    </a>

                    <a class="card" href="{{ url_for('reservierungen') }}">
                        📅 Meine Reservierungen
                    </a>

                </div>
            </div>

        </div>

    </div>
</div>
<div class="bottom-links">
    <a href="{{ url_for('datenschutz') }}">Datenschutz</a>
    <a href="{{ url_for('impressum') }}">Impressum</a>
</div>
<div class="footer-bar">
    {% if session.get("email", "").lower() == "jessica.bausch24@gmail.com" %}
        <a href="{{ url_for('admin') }}">Adminbereich</a>
    {% endif %}

    <a href="{{ url_for('logout') }}">Logout</a>
</div>

</body>
</html>
