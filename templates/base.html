<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hexenapp{% endblock %}</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    min-height: 100vh;
    padding-bottom: 80px;
}

.main {
    padding: 20px;
}

.footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #1f1936;
    display: flex;
    justify-content: center;
    gap: 35px;
    padding: 15px 0;
    z-index: 999;
}

.footer-bar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.back-arrow {
    position: fixed;
    top: 20px;
    left: 25px;
    z-index: 1000;
}

.back-arrow a {
    color: white;
    font-size: 30px;
    text-decoration: none;
    font-weight: bold;
}

.back-arrow a:hover {
    transform: scale(1.2);
}
.password-wrapper {
    position: relative;
}

.password-wrapper input {
    width: 100%;
    padding-right: 40px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
}

{% block styles %}{% endblock %}
</style>

</head>

<body>

{% if session.get('user') and request.endpoint not in ['dashboard', 'login', 'register'] %}
<div class="back-arrow">
    <a href="javascript:history.back()">⬅</a>
</div>
{% endif %}

<div class="main">
    {% block content %}{% endblock %}
</div>

{% if not hide_footer %}
<div class="footer-bar">
    <a href="{{ url_for('dashboard') }}">Start</a>

    {% if session.get('user') == "Jessi24" %}
        <a href="{{ url_for('admin') }}">Adminbereich</a>
    {% endif %}

    <a href="{{ url_for('logout') }}">Logout</a>
</div>
{% endif %}

<script>
function togglePassword(id) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}
</script>
</body>
</html>
