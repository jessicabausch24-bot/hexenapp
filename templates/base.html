<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hexenapp{% endblock %}</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    min-height: 100vh;
    padding-bottom: 80px;
}

.main {
    padding: 20px;
}

.footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #1f1936;
    display: flex;
    justify-content: center;
    gap: 35px;
    padding: 15px 0;
    z-index: 999;
}

.footer-bar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.back-arrow {
    position: fixed;
    top: 20px;
    left: 25px;
    z-index: 1000;
}

.back-arrow a {
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 26px;
    padding: 8px 14px;
    border-radius: 50%;
    text-decoration: none;
    font-weight: bold;
}

.back-arrow a:hover {
    transform: scale(1.1);
}

{% block styles %}{% endblock %}
</style>

</head>

<body>

{% if session.get('user') and request.endpoint not in ['dashboard', 'login'] %}
<div class="back-arrow">
    <a href="javascript:history.back()">⬅</a>
</div>
{% endif %}

<div class="main">
    {% block content %}{% endblock %}
</div>

{% if not hide_footer %}
<div class="footer-bar">
    <a href="{{ url_for('dashboard') }}">Start</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>
{% endif %}

</body>
</html>
