<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Oachberghexa App{% endblock %}</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
<div class="back-arrow">
    <a href="javascript:history.back()">⬅</a>
</div>
.main {
    flex: 1;
    padding: 20px;
    box-sizing: border-box;
}

.footer-bar {
    background: #1f1936;
    padding: 14px;
    text-align: center;
}

.footer-bar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin: 0 18px;
    font-size: 16px;
}

.footer-bar a:hover {
    text-decoration: underline;
}
.back-arrow {
    position: fixed;
    top: 20px;
    left: 25px;
    z-index: 1000;
}

.back-arrow a {
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 26px;
    padding: 8px 14px;
    border-radius: 50%;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    transition: 0.2s;
}

.back-arrow a:hover {
    transform: scale(1.2);
}
{% block styles %}{% endblock %}
</style>
</head>

<body>

<div class="main">
    {% block content %}{% endblock %}
</div>

{% if not hide_footer %}
<div class="footer-bar">
    <a href="{{ url_for('dashboard') }}">Start</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>
{% endif %}
</body>
</html>
