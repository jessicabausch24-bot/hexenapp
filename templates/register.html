<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrieren</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f1936, #a64fff);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: white;
    color: #1f1936;
    padding: 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ccc;
    margin-top: 5px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: #6a1cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #5200b8;
}

.error {
    margin-top: 10px;
    color: red;
    font-weight: bold;
}

.footer {
    margin-top: 15px;
    text-align: center;
}

.footer a {
    color: #6a1cff;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <h1>Registrieren</h1>

    <!-- FEHLERMELDUNG -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <!-- FORM -->
    <form method="POST">

        <label for="name">Vollständiger Name</label>
        <input type="text" id="name" name="name" required placeholder="Vor- und Nachname">

        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" required placeholder="deine@email.de">

        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" required placeholder="Passwort">

        <button type="submit">Registrieren</button>

    </form>

    <!-- FOOTER -->
    <div class="footer">
        <p>Schon ein Konto?</p>
        <a href="/login">Zum Login</a>
    </div>

</div>

</body>
</html>
