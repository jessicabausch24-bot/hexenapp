<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellung bearbeiten</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f1936, #a64fff);
            color: white;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .page-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            color: #333;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .item-box {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            margin-top: 18px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-save {
            background: #6a1cff;
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #6a1cff;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="card">
        <h1>Bestellung bearbeiten</h1>

        <form method="POST">
            <label for="user">User</label>
            <input type="text" id="user" name="user" value="{{ order.user }}">

            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" value="{{ order.email }}">

            <h2>Artikel</h2>

            {% for item in order.get("items", []) %}
            <div class="item-box">
                <label for="name_{{ loop.index0 }}">Artikelname</label>
                <input type="text" id="name_{{ loop.index0 }}" name="name_{{ loop.index0 }}" value="{{ item.name }}">

                <label for="anzahl_{{ loop.index0 }}">Anzahl</label>
                <input type="number" id="anzahl_{{ loop.index0 }}" name="anzahl_{{ loop.index0 }}" value="{{ item.anzahl }}" min="1">

                <label for="groesse_{{ loop.index0 }}">Größe</label>
                <input type="text" id="groesse_{{ loop.index0 }}" name="groesse_{{ loop.index0 }}" value="{{ item.groesse if item.groesse else '' }}">

                <label for="anmerkung_{{ loop.index0 }}">Anmerkung</label>
                <textarea id="anmerkung_{{ loop.index0 }}" name="anmerkung_{{ loop.index0 }}">{{ item.anmerkung if item.anmerkung else '' }}</textarea>
            </div>
            {% endfor %}

            <button class="btn btn-save" type="submit">Speichern</button>
        </form>

        <a class="back-link" href="/admin/bestellungen">← Zurück zu Bestellungen</a>
    </div>
</div>
</body>
</html>
