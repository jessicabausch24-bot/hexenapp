<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Benutzer bearbeiten</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f1936, #a64fff);
            color: white;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .page-wrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            color: #333;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .card-body {
            padding: 28px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #d9d9d9;
            border-radius: 14px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .admin-check {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f3f0ff;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .admin-check input {
            width: 20px;
            height: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px 18px;
            background: #6a1cff;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: #5200b8;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #6a1cff;
            text-decoration: none;
        }

        .error {
            color: #b00020;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .hint {
            font-size: 14px;
            color: #666;
            margin-top: -10px;
            margin-bottom: 16px;
        }.admin-check {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f3f0ff;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 18px;
    font-weight: bold;
}

.admin-check input {
    width: 20px;
    height: 20px;
}
    </style>
</head>

<body>

<div class="page-wrapper">
    <div class="card">
        <div class="card-body">
            <h1>Benutzer bearbeiten</h1>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="{{ user.name }}" required>

                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" value="{{ current_email }}" required>

                <label for="password">Neues Passwort</label>
                <input type="text" id="password" name="password" placeholder="Leer lassen, wenn es gleich bleiben soll">
                <div class="hint">Nur ausfüllen, wenn das Passwort geändert werden soll.</div>

                <label class="admin-check">
                    <input type="checkbox" name="is_admin" {% if user.get('is_admin') %}checked{% endif %}>
                    Adminrechte vergeben
                </label>
                <label class="admin-check">
                <input type="checkbox" name="is_admin" {% if user.get('is_admin') %}checked{% endif %}>
                 Adminrechte vergeben
                </label>
                <button type="submit" class="btn">Speichern</button>
            </form>

            <a class="back-link" href="/admin/users">← Zurück zur Benutzerverwaltung</a>
        </div>
    </div>
</div>

</body>
</html>
