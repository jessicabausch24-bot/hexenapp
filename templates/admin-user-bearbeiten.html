<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Benutzer bearbeiten</title>

<style>
.admin-check {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f3f0ff;
    padding: 16px 18px;
    border-radius: 16px;
    margin: 20px 0;
    color: #1f1936;
    font-weight: bold;
    font-size: 16px;
}

.admin-check input {
    width: 22px;
    height: 22px;
    accent-color: #6a1cff;
    cursor: pointer;
}

.admin-check span {
    display: inline-block;
}

/* Mobil bleibt sauber */
@media (max-width: 600px) {
    .admin-check {
        font-size: 15px;
        padding: 14px;
        gap: 10px;
    }

    .admin-check input {
        width: 20px;
        height: 20px;
    }
}
</style>
</head>

<body>

<div class="page-wrapper">
    <div class="card">
        <h1>Benutzer bearbeiten</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ user.name }}" required>

            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" value="{{ current_email }}" required>

            <label for="password">Neues Passwort</label>
            <input type="text" id="password" name="password" placeholder="Leer lassen, wenn es gleich bleiben soll">
            <div class="hint">Nur ausfüllen, wenn das Passwort geändert werden soll.</div>

           <label class="admin-check">
    <input type="checkbox" name="is_admin" {% if user.get('is_admin') %}checked{% endif %}>
    <span>Adminrechte vergeben</span>
</label>

            <button type="submit" class="btn">Speichern</button>
        </form>

        <a class="back-link" href="{{ url_for('admin_users') }}">← Zurück zur Benutzerverwaltung</a>
    </div>
</div>

</body>
</html>
